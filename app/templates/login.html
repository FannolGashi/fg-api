{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-8rem)] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
      <h1 class="text-2xl font-bold text-white mb-1">{{ app_name }}</h1>
      <p class="text-gray-400 text-sm mb-6">Sign in to manage endpoints</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
          <input id="username" type="text" autocomplete="username" required
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white
                        focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                 placeholder="admin"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
          <input id="password" type="password" autocomplete="current-password" required
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white
                        focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                 placeholder="••••••••"/>
        </div>
        <div id="loginErr" class="hidden text-sm text-red-300 bg-red-900/30 border border-red-800 rounded px-3 py-2"></div>
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg py-2 text-sm
                       transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
                       focus:ring-offset-gray-900 disabled:opacity-50">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const err = document.getElementById('loginErr');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.classList.add('hidden');

  const fd = new FormData();
  fd.append('username', document.getElementById('username').value);
  fd.append('password', document.getElementById('password').value);

  try {
    const r = await fetch('/api/auth/login', { method: 'POST', body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || 'Login failed');
    location.href = '/ui';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
{% endblock %}
